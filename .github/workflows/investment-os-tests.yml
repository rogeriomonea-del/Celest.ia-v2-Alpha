name: investment-os tests

on:
  push:
    paths: ["investment_os/**", "tests/investment_os/**", "requirements.txt"]
  pull_request:
    paths: ["investment_os/**", "tests/investment_os/**", "requirements.txt"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # Testes são offline por construção (fixtures congeladas; sem rede)
      - run: python -m pytest tests/investment_os -q
